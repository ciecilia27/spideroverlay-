<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Spiderman TikTok Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --spidey-red: #e0212b;
    --spidey-red-dark: #a3141c;
    --spidey-blue: #14357a;
    --spidey-blue-light: #2a5cc4;
    --web-line: rgba(255,255,255,0.55);
    --ink: #10121a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  /* ============ FRAME ============ */
  .frame {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .frame-border {
    position: absolute;
    inset: 0;
    border: 10px solid var(--spidey-red);
    border-image: linear-gradient(90deg, var(--spidey-red) 0%, var(--spidey-blue) 25%, var(--spidey-red) 50%, var(--spidey-blue) 75%, var(--spidey-red) 100%) 1;
    box-shadow:
      inset 0 0 0 3px var(--ink),
      inset 0 0 40px rgba(0,0,0,0.35);
  }

  /* thin web-strand texture running just inside the border */
  .web-strip {
    position: absolute;
    inset: 16px;
    border: 1px dashed rgba(255,255,255,0.35);
    opacity: 0.6;
  }

  /* ============ CORNER WEBS ============ */
  .corner-web {
    position: absolute;
    width: 190px;
    height: 190px;
    opacity: 0.85;
  }
  .corner-web.tl { top: -6px; left: -6px; }
  .corner-web.tr { top: -6px; right: -6px; transform: scaleX(-1); }
  .corner-web.bl { bottom: -6px; left: -6px; transform: scaleY(-1); }
  .corner-web.br { bottom: -6px; right: -6px; transform: scale(-1,-1); }

  /* ============ TOP HEADER ============ */
  .top-left {
    position: fixed;
    top: 22px;
    left: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
  }

  .spider-logo {
    width: 34px;
    height: 34px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    animation: wiggle 3.2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  .live-badge {
    background: linear-gradient(180deg, var(--spidey-red), var(--spidey-red-dark));
    border: 2px solid #ffd21a;
    color: #fff;
    font-family: 'Bangers', cursive;
    letter-spacing: 2px;
    font-size: 20px;
    padding: 6px 18px 6px 14px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 3px 0 #6e0d12, 0 6px 10px rgba(0,0,0,0.35);
  }
  .live-dot {
    width: 9px;
    height: 9px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  .top-center {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
  }
  .top-center .deco {
    color: var(--spidey-blue-light);
    font-size: 13px;
    letter-spacing: 6px;
    margin-bottom: 2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .top-center h1 {
    font-family: 'Bangers', cursive;
    font-size: 46px;
    letter-spacing: 2px;
    margin: 0;
    color: var(--spidey-red);
    -webkit-text-stroke: 2.5px var(--ink);
    text-shadow: 0 3px 0 var(--spidey-blue), 0 3px 6px rgba(0,0,0,0.5);
  }
  .top-center .tagline {
    margin: 4px 0 0;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .handle-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
    padding: 4px 16px;
    background: rgba(16,18,26,0.55);
    border: 1.5px solid var(--spidey-red);
    border-radius: 20px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
  }

  .top-right {
    position: fixed;
    top: 14px;
    right: 22px;
    z-index: 5;
  }
  .badge-web {
    width: 110px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.45));
  }

  /* ============ MASCOT (bottom-left, chibi spider-hero) ============ */
  .mascot-wrap {
    position: fixed;
    bottom: 84px;
    left: 34px;
    width: 140px;
    height: 140px;
    z-index: 4;
    animation: bob 2.6s ease-in-out infinite;
  }
  .mascot {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border: none;
    border-radius: 0;
    display: block;
    z-index: 1;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }


  /* ============ FOLLOW BADGE (bottom-right, replaces QR) ============ */
  .follow-badge {
    position: fixed;
    bottom: 26px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--spidey-red), var(--spidey-blue));
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 10px 18px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    z-index: 5;
  }
  .follow-badge .icon { width: 26px; height: 26px; }
  .follow-badge span {
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 17px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  /* ============ HALFTONE COMIC TEXTURE ============ */
  .halftone {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: radial-gradient(rgba(224,33,43,0.16) 1.4px, transparent 1.4px);
    background-size: 14px 14px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 0%, transparent 75%);
    opacity: 0.55;
  }

  /* ============ CITY SKYLINE ============ */
  .skyline {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    height: 90px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.9;
  }

</style>
